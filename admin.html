<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <title>Admin Dashboard</title>
    <style>
        body { font-family: Arial, sans-serif; background: #121212; color: #fff; padding: 20px; }
        .panel { max-width: 1000px; margin: auto; background: #1e1e1e; padding: 20px; border-radius: 8px; margin-bottom: 20px; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { border: 1px solid #333; padding: 10px; text-align: left; font-size: 14px; }
        th { background: #2c2c2c; }
        input, button { padding: 10px; margin: 5px 0; border-radius: 4px; border: none; }
        button { background: #28a745; color: white; cursor: pointer; }
        .draw-btn { background: #dc3545; float: right; margin-bottom: 15px; }
        .logout-btn { background: #6c757d; margin-bottom: 15px; }
    </style>
</head>
<body>
    <div class="panel">
        <h2>🔒 የአድሚን ሚስጥራዊ መቆጣጠሪያ</h2>
        <div id="login-box">
            <input type="password" id="secret-key" placeholder="የአድሚን ሚስጥር ቁጥር">
            <button onclick="loadAdmin()">ግባ</button>
        </div>
        
        <div id="table-box" style="display:none;">
            <button class="logout-btn" onclick="adminLogout()">ወጣ (Logout)</button>
            <button class="draw-btn" onclick="triggerDraw()">🎲 ዕጣ ማውጣት (Live Draw)</button>
            
            <h3>🎟 የቲኬቶች እና የክፍያ ማረጋገጫ ዝርዝር</h3>
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>ስም & ስልክ</th>
                        <th>ቁጥር</th>
                        <th>ዓይነት</th>
                        <th>የባንክ receipt</th>
                        <th>ሁኔታ</th>
                        <th>እርምጃ</th>
                    </tr>
                </thead>
                <tbody id="tbody-tickets"></tbody>
            </table>

            <h3 style="margin-top:30px;">💬 ከደንበኞች የተላኩ መልዕክቶች</h3>
            <table>
                <thead>
                    <tr>
                        <th>ኢሜል</th>
                        <th>መልዕክት</th>
                        <th>ቀን</th>
                    </tr>
                </thead>
                <tbody id="tbody-msgs"></tbody>
            </table>
        </div>
    </div>

    <script>
        let currentKey = "";

        async function loadAdmin() {
            currentKey = document.getElementById('secret-key').value;
            const res = await fetch(`/api/admin/tickets?secret=${currentKey}`);
            if(!res.ok) { alert("የተሳሳተ ሚስጥር ቁጥር!"); return; }
            
            document.getElementById('login-box').style.display = 'none';
            document.getElementById('table-box').style.display = 'block';
            
            // Load Tickets
            const data = await res.json();
            const tbody = document.getElementById('tbody-tickets');
            tbody.innerHTML = '';
            data.forEach(t => {
                tbody.innerHTML += `
                    <tr>
                        <td>${t.id}</td>
                        <td>${t.full_name} (${t.phone})</td>
                        <td><b>${t.number}</b></td>
                        <td>${t.type}</td>
                        <td style="color: #ffc107; font-weight: bold;">${t.bank_receipt || 'የለም'}</td>
                        <td>${t.status}</td>
                        <td>${t.status === 'PENDING' ? `<button onclick="approve('${t.tx_ref}')">አጽድቅ</button>` : 'ጸድቋል'}</td>
                    </tr>
                `;
            });

            // Load Messages
            const msgRes = await fetch(`/api/admin/messages?secret=${currentKey}`);
            const msgs = await msgRes.json();
            const msgTbody = document.getElementById('tbody-msgs');
            msgTbody.innerHTML = '';
            msgs.forEach(m => {
                msgTbody.innerHTML += `
                    <tr>
                        <td>${m.user_email}</td>
                        <td>${m.message}</td>
                        <td>${m.created_at}</td>
                    </tr>
                `;
            });
        }

        async function approve(tx_ref) {
            const res = await fetch(`/api/admin/approve/${tx_ref}?secret=${currentKey}`, {method: 'POST'});
            if(res.ok) { alert("ቲኬቱ ጸድቋል!"); loadAdmin(); }
        }

        async function triggerDraw() {
            if(!confirm("እርግጠኛ ኖት? ዕጣ ማውጣት ይጀምር?")) return;
            const res = await fetch(`/api/admin/draw?secret=${currentKey}`, {method: 'POST'});
            const json = await res.json();
            if(res.ok) { alert(json.message); } else { alert(json.detail); }
        }

        function adminLogout() {
            currentKey = "";
            document.getElementById('table-box').style.display = 'none';
            document.getElementById('login-box').style.display = 'block';
            document.getElementById('secret-key').value = "";
        }
    </script>
</body>
</html>
